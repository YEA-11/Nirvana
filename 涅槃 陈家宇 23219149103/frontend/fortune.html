<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能记账本 - 今日财运</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="home.html" class="logo">
                <i class="fas fa-wallet"></i> 智能记账本
            </a>
            <div class="nav-links">
                <a href="home.html">
                    <i class="fas fa-home"></i> 首页
                </a>
                <a href="profile.html">
                    <i class="fas fa-user"></i> 个人信息
                </a>
                <a href="fortune.html">
                    <i class="fas fa-star"></i> 今日财运
                </a>
            </div>
            <div class="user-info">
                <span id="nickname">加载中...</span>
                <button class="logout-btn" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card fortune-card">
            <div class="fortune-icon">
                <i class="fas fa-gem"></i>
            </div>
            <h2 class="card-title" style="border-bottom: none; margin-bottom: 2rem;">今日财运预测</h2>
            <div class="fortune-text" id="fortune-content">
                加载中...
            </div>
            <div class="lucky-grid">
                <div class="lucky-item">
                    <div class="lucky-label">
                        <i class="fas fa-hashtag"></i> 幸运数字
                    </div>
                    <div class="lucky-value" id="lucky-number">--</div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-label">
                        <i class="fas fa-utensils"></i> 幸运食物
                    </div>
                    <div class="lucky-value" id="lucky-food">--</div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-label">
                        <i class="fas fa-palette"></i> 幸运颜色
                    </div>
                    <div class="lucky-value" id="lucky-color">--</div>
                </div>
                <div class="lucky-item">
                    <div class="lucky-label">
                        <i class="fas fa-flower"></i> 幸运花
                    </div>
                    <div class="lucky-value" id="lucky-flower">--</div>
                </div>
            </div>
            <button class="btn btn-primary" id="refresh-fortune" style="margin-top: 3rem;">
                <i class="fas fa-sync-alt"></i> 刷新财运
            </button>
        </div>

        <!-- 财运小贴士 -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-info-circle"></i> 财运小贴士
            </div>
            <div style="font-size: 1.05rem; line-height: 1.8;">
                <p>✨ 本财运预测仅供娱乐，理性对待收支规划</p>
                <p>✨ 保持良好消费习惯，合理分配收入是致富关键</p>
                <p>✨ 建议每月预留30%收入作为储蓄，为未来储备</p>
                <p>✨ 避免冲动消费，大额支出前可先记录预算再执行</p>
                <p>✨ 定期查看记账统计，及时调整消费结构</p>
            </div>
        </div>

        <!-- 娱乐链接 -->
        <div class="links-section">
            <h3 class="links-title">娱乐休闲推荐</h3>
            <div class="links-container">
                <a href="https://www.bilibili.com" target="_blank" class="link-card">
                    <i class="fab fa-bilibili"></i> B站
                </a>
                <a href="https://www.netflix.com" target="_blank" class="link-card">
                    <i class="fab fa-netflix"></i> Netflix
                </a>
                <a href="https://www.kuaishou.com" target="_blank" class="link-card">
                    <i class="fas fa-video"></i> 快手
                </a>
                <a href="https://www.tencentvideo.com" target="_blank" class="link-card">
                    <i class="fas fa-play-circle"></i> 腾讯视频
                </a>
                <a href="https://www.iqiyi.com" target="_blank" class="link-card">
                    <i class="fas fa-film"></i> 爱奇艺
                </a>
            </div>
        </div>
    </div>

    <script src="js/fortune.js"></script>
</body>
</html>
